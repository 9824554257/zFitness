<!-- App body starts -->
<div class="app-body">
  <!-- Row starts -->
  <div class="row gx-4">
    <div class="col-sm-12">
      <div class="card">
        <div class="card-header">
          <h5 class="card-title">{{ isEditMode ? 'Edit Staff Details' : 'Add Staff Details' }}</h5>
        </div>
        <div class="card-body">
          <!-- Row starts -->
                       <div class="col-12">
              <div class="d-flex justify-content-center mb-4">
                <div class="position-relative">
                  <div class="d-flex align-items-center justify-content-center rounded-circle border bg-light" 
                       style="width: 120px; height: 120px; overflow: hidden;">
                    <ng-container *ngIf="currentImageUrl; else defaultIcon">
                      <img 
                        [src]="currentImageUrl" 
                        alt="Staff Photo" 
                        class="w-100 h-100" 
                        style="object-fit: cover;"
                      >
                    </ng-container>
                    <ng-template #defaultIcon>
                      <i class="ri-user-line fs-1 text-muted"></i>
                    </ng-template>
                  </div>
                  <button 
                    *ngIf="currentImageUrl"
                    type="button"
                    class="btn btn-danger btn-sm position-absolute bottom-0 end-0 rounded-circle"
                    style="width: 32px; height: 32px; padding: 0; font-size: 14px;"
                    (click)="deleteCurrentImage()"
                    title="Remove Photo"
                  >
                    <i class="ri-delete-bin-line"></i>
                  </button>
                </div>
              </div>
              <div class="d-flex justify-content-center mb-4">
                <div class="d-flex flex-column align-items-center gap-2">
                  <div class="d-flex gap-2">
                    <input
                      type="file"
                      class="form-control form-control-sm d-none"
                      id="staffPhotoFile"
                      accept="image/*"
                      (change)="onPhotoFileSelected($event)"
                    >
                    <label for="staffPhotoFile" class="btn btn-outline-primary btn-sm">
                      <i class="ri-upload-line me-1"></i>
                      Upload Photo
                    </label>
                    <button 
                      type="button" 
                      class="btn btn-outline-secondary btn-sm"
                      (click)="openWebcamModal()"
                    >
                      <i class="ri-camera-line me-1"></i>
                      Take Photo
                    </button>
                  </div>
                  <small class="text-muted text-center">
                    Upload a photo or use webcam to capture.<br>Max size: 1MB
                  </small>
                </div>
              </div>
            </div>
          <div class="row gx-4">
            <div class="col-xxl-3 col-lg-4 col-sm-6">
              <div class="mb-3">
                <label class="form-label" for="a1"
                  >Staff Code <span class="text-danger">*</span></label
                >
                <input type="text" [(ngModel)]="staffDetails.staffCode" class="form-control" id="Text1" placeholder="Enter Staff Code" />
              </div>
            </div>
            <div class="col-xxl-3 col-lg-4 col-sm-6">
              <div class="mb-3">
                <label class="form-label" for="a1"
                  >Full Name <span class="text-danger">*</span></label
                >
                <input type="text" class="form-control" id="a1" placeholder="Enter Full Name" [(ngModel)]="staffDetails.staffName" name="staffName" />
              </div>
            </div>
            <div class="col-xxl-3 col-lg-4 col-sm-6">
              <div class="mb-3">
                <label class="form-label" for="a2">Email <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="a2" placeholder="Enter Email" [(ngModel)]="staffDetails.email" name="email" />
              </div>
            </div>
            <div class="col-xxl-3 col-lg-4 col-sm-6">
              <div class="mb-3">
                <label class="form-label" for="a3"
                  >Mobile Number<span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  class="form-control"
                  id="a3"
                  placeholder="Enter Mobile Number"
                  [(ngModel)]="staffDetails.phoneNumber"
                  name="phoneNumber"
                />
              </div>
            </div>
            <div class="col-xxl-3 col-lg-4 col-sm-6">
              <div class="mb-3">
                <label class="form-label" for="a3">Age<span class="text-danger">*</span></label>
                <input type="number" class="form-control" id="age" placeholder="Enter Age" [(ngModel)]="staffDetails.age" />
              </div>
            </div>
            <div class="col-xxl-3 col-lg-4 col-sm-6">
              <div class="mb-3">
                <label class="form-label" for="a4"
                  >Date of Birth <span class="text-danger">*</span></label
                >
                <input type="date" class="form-control" id="a4" placeholder="Enter DOB" [(ngModel)]="staffDetails.dateOfBirth" />
              </div>
            </div>
            <div class="col-xxl-3 col-lg-4 col-sm-6">
              <div class="mb-3">
                <label class="form-label" for="a5">Joining Date</label>
                <input type="date" class="form-control" id="Date1" placeholder="Enter DOB" [(ngModel)]="staffDetails.joinDate"  />
              </div>
            </div>
            <div class="col-xxl-3 col-lg-4 col-sm-6">
              <div class="mb-3">
                <label class="form-label" for="a5">Left Date</label>
                <input type="date" class="form-control" id="Date3" placeholder="Enter Left Date" [(ngModel)]="staffDetails.leftDate" />
              </div>
            </div>
            <div class="col-xxl-3 col-lg-4 col-sm-6">
              <div class="mb-3">
                <label class="form-label" for="a6">Designation</label>
                <select class="form-select" id="a6" [(ngModel)]="staffDetails.designation" name="designation">
                  <option value="">Select</option>
                  <option value="PT">PT</option>
                  <option value="Trainer">Trainer</option>
                  <option value="Manager">Manager</option>
                </select>
              </div>
            </div>
            <div class="col-xxl-3 col-lg-4 col-sm-6">
              <div class="mb-3">
                <label class="form-label" for="a5">Address</label>
                <textarea
                  [(ngModel)]="staffDetails.address"
                  type="remarks"
                  class="form-control"
                  id="remarks"
                  placeholder="Enter Address"
                  rows="2"
                  cols="60"
                ></textarea>
              </div>
            </div>
            <div class="col-xxl-3 col-lg-4 col-sm-6">
              <div class="mb-3">
                <label class="form-label" for="emergencyContactName">Emergency Contact Name</label>
                <input type="text" class="form-control" id="emergencyContactName" placeholder="Enter Emergency Contact Name" [(ngModel)]="staffDetails.emergencyContactName" name="emergencyContactName" />
              </div>
            </div>
            <div class="col-xxl-3 col-lg-4 col-sm-6">
              <div class="mb-3">
                <label class="form-label" for="emergencyContactNumber">Emergency Contact Number</label>
                <input type="text" class="form-control" id="emergencyContactNumber" placeholder="Enter Emergency Contact Number" [(ngModel)]="staffDetails.emergencyContactNumber" name="emergencyContactNumber" />
              </div>
            </div>
            <div class="col-sm-12">
              <div class="d-flex gap-2 justify-content-end">
                <button type="button" class="btn btn-outline-secondary" (click)="cancel()">Cancel</button>
                <button type="button" class="btn btn-primary" (click)="saveStaff(true)">Save</button>
              </div>
            </div>
          </div>
          <!-- Row ends -->
        </div>
      </div>
    </div>
  </div>
  <!-- Row ends -->
</div>
<!-- App body ends -->

<!-- Webcam Modal -->
<dialog #webcamModal style="border: none; border-radius: 8px; max-width: 600px; width: 90%;">
  <div class="modal-header">
    <h5>Capture Photo</h5>
    <button class="btn-close-x" (click)="closeWebcamModal()">&times;</button>
  </div>
  <div class="modal-body text-center">
    <video
      #webcamVideo
      autoplay
      playsinline
      muted
      style="width: 100%; max-width: 400px; border-radius: 8px; border: 2px solid #e9ecef; background: black;"
    ></video>
    <canvas #webcamCanvas style="display: none;"></canvas>

    <div class="mt-3" *ngIf="!isWebcamActive()">
      <p>Requesting camera access...</p>
    </div>

    <div class="mt-3">
      <button
        type="button"
        class="btn btn-primary me-2"
        (click)="capturePhoto()"
        [disabled]="!isWebcamActive()"
      >
        <i class="ri-camera-line me-1"></i>
        Capture
      </button>
      <button
        type="button"
        class="btn btn-secondary"
        (click)="closeWebcamModal()"
      >
        Cancel
      </button>
    </div>
  </div>
</dialog>
