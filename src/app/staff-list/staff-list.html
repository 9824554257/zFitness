  <!-- Row starts -->
  <div class="row gx-4">
    <div class="col-sm-12">
      <div class="card">
        <div class="card-header d-flex align-items-center justify-content-between">
          <h5 class="card-title">Staff List</h5>
          <a routerLink="/addStaff" class="btn btn-primary ms-auto">Add New Staff</a>
        </div>
        <div class="card-body">
          <!-- Table starts -->
          <div class="table-responsive">
            <table id="basicExample" class="table m-0 align-middle">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Name</th>
                  <th>Age</th>
                  <th>Gender</th>
                  <th>Contact</th>
                  <th>Email</th>
                  <th>DOJ</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let staff of staffList; let i = index">
                  <td>{{ i + 1 }}</td>
                  <td>
                    <img
                      *ngIf="staff.userImageUrl"
                      [src]="staff.userImageUrl"
                      class="img-shadow img-2x rounded-5 me-1"
                      alt="staff photo"
                      style="width:36px; height:36px; object-fit:cover;"
                    />
                    {{ staff.staffName }}
                  </td>
                  <td>-</td>
                  <td>-</td>
                  <td>{{ staff.phoneNumber }}</td>
                  <td>{{ staff.email }}</td>
                  <td>{{ staff.createdDate | date:'yyyy-MM-dd' }}</td>
                  <td>
                    <div class="d-inline-flex gap-1">
                      <button
                        class="btn btn-outline-danger btn-sm"
                        (click)="deleteStaff(staff)"
                      >
                        <i class="ri-delete-bin-line"></i>
                      </button>
                      <button
                        class="btn btn-outline-success btn-sm"
                        (click)="editStaff(staff)"
                      >
                        <i class="ri-edit-box-line"></i>
                      </button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <!-- Table ends -->

          <!-- Modal Delete Row -->
          <div
            class="modal fade"
            id="delRow"
            tabindex="-1"
            aria-labelledby="delRowLabel"
            aria-hidden="true"
          >
            <div class="modal-dialog modal-sm">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title" id="delRowLabel">Confirm</h5>
                  <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                  ></button>
                </div>
                <div class="modal-body">Are you sure you want to delete the gym member?</div>
                <div class="modal-footer">
                  <div class="d-flex justify-content-end gap-2">
                    <button class="btn btn-secondary" data-bs-dismiss="modal" aria-label="Close">
                      No
                    </button>
                    <button class="btn btn-danger">Yes</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Row ends -->
</div>
<!-- App body ends -->
